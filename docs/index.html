<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Sentences Task — Preview</title>
<style>
  body { font-family: Georgia, serif; background: #fff; color: #000; margin: 0; }
  #app { max-width: 760px; margin: 0 auto; padding: 40px 20px; text-align: center; }
  .note { font-family: sans-serif; font-size: 13px; background: #f2f2f2; border: 1px solid #ccc; padding: 12px; text-align: left; margin-bottom: 28px; }
  .note b { display: block; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: normal; }
  .sentence { font-size: 26px; margin: 90px 0 50px; min-height: 80px; }
  .scale { font-size: 18px; letter-spacing: 1px; }
  .fix { font-size: 40px; margin: 120px 0; }
  .small { font-family: sans-serif; font-size: 13px; color: #555; margin-top: 40px; }
  .pm-flag { font-family: sans-serif; color: #0a0; font-size: 15px; height: 20px; margin-top: 18px; }
  button { font-family: sans-serif; font-size: 15px; padding: 10px 22px; margin-top: 24px; cursor: pointer; }
  table { margin: 24px auto; border-collapse: collapse; font-family: sans-serif; font-size: 14px; text-align: left; }
  td, th { border: 1px solid #ccc; padding: 6px 12px; }
  .start-text { font-size: 19px; line-height: 1.6; text-align: left; }
  .group-letter { font-size: 40px; margin: 24px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"fillers": [{"Sentence": "The poet was dying of aids.", "Rating": 2}, {"Sentence": "They found the resident of the house handcuffed in a corner.", "Rating": 2}, {"Sentence": "The pope was assassinated by the Mafia.", "Rating": 2}, {"Sentence": "The prisoners beat up the detective.", "Rating": 2}, {"Sentence": "They looked at the scan showing the tumour.", "Rating": 2.5}, {"Sentence": "They went on a trip away and were kidnapped.", "Rating": 2.5}, {"Sentence": "The painting was of a starving child.", "Rating": 2.5}, {"Sentence": "The foam gathered around his rabid mouth.", "Rating": 2.5}, {"Sentence": "The store was infested with rats and cockroaches.", "Rating": 2.5}, {"Sentence": "When her last relative died she went to a home for orphans.", "Rating": 2.5}, {"Sentence": "She never had a wash and smelt disgusting.", "Rating": 2.5}, {"Sentence": "The smoke rose from the buildings into the night.", "Rating": 3}, {"Sentence": "Household dust is formed of dead mites and lice.", "Rating": 3}, {"Sentence": "He found that his favourite suit had been cut to shreds.", "Rating": 3}, {"Sentence": "The tissue was covered in blood and pus.", "Rating": 3}, {"Sentence": "They injected the steroid into his muscle.", "Rating": 3}, {"Sentence": "He said he treated her like an object because she was stupid.", "Rating": 3}, {"Sentence": "The musical closed after three disastrous performances.", "Rating": 3.5}, {"Sentence": "The palace was burned to the ground during the revolution.", "Rating": 3.5}, {"Sentence": "The passage was full of muggers and drug dealers.", "Rating": 3.5}, {"Sentence": "The thyroid disorder made his eyes bulge.", "Rating": 3.5}, {"Sentence": "The marriage was a sham and they both had affairs.", "Rating": 3.5}, {"Sentence": "The mayor swindled money from the council.", "Rating": 3.5}, {"Sentence": "The model was anorexic and hardly ate.", "Rating": 3.5}, {"Sentence": "The masked gunmen ransacked the shop.", "Rating": 3.5}, {"Sentence": "He lost the money through a hole in his pocket.", "Rating": 3.5}, {"Sentence": "The boss kept them behind and they missed lunch.", "Rating": 4}, {"Sentence": "They went to play bowls but the lawn had been dug up by vandals.", "Rating": 4}, {"Sentence": "He asked for the package to be sent to his home.", "Rating": 5}, {"Sentence": "She hung the sheet out on the line to dry.", "Rating": 5}, {"Sentence": "She loaded the box up with books.", "Rating": 5}, {"Sentence": "She poured the liquid into the container.", "Rating": 5}, {"Sentence": "She put her hat on in the porch.", "Rating": 5}, {"Sentence": "She put the ring on her dressing table.", "Rating": 5}, {"Sentence": "She took the same path to school everyday.", "Rating": 5}, {"Sentence": "She used the dictionary to help with her spelling.", "Rating": 5}, {"Sentence": "She went to her bedroom to read a magazine.", "Rating": 5}, {"Sentence": "She wrote down her address for the receptionist.", "Rating": 5}, {"Sentence": "The apartment was in the town center.", "Rating": 5}, {"Sentence": "The book was aimed at people who were interested in fashion.", "Rating": 5}, {"Sentence": "The boy drew in a margin before he began writing.", "Rating": 5}, {"Sentence": "The cattle grazed in the field for most of the day.", "Rating": 5}, {"Sentence": "The walked over the hill, and round a corner", "Rating": 5}, {"Sentence": "The customer picked up a basket from by the door.", "Rating": 5}, {"Sentence": "The fiction section is on the second floor.", "Rating": 5}, {"Sentence": "They hung the drawing in the living room.", "Rating": 5}, {"Sentence": "The jumpers are being ordered from the factory for the catalogue.", "Rating": 5}, {"Sentence": "The put the guest in the spare room at the end of their hall.", "Rating": 5}, {"Sentence": "The shirt was made from cotton and had short sleeves.", "Rating": 5}, {"Sentence": "The symphony was written on manuscript.", "Rating": 5}, {"Sentence": "The tickets for the opera cost ten pounds.", "Rating": 5}, {"Sentence": "She sat at the desk in the middle of the class.", "Rating": 5}, {"Sentence": "She sat on the rock and tied her shoelace.", "Rating": 5}, {"Sentence": "She turned the handle and entered the room.", "Rating": 5}, {"Sentence": "They moved to the capital after university for work purposes", "Rating": 5}, {"Sentence": "The weather that day was the same as usual.", "Rating": 5}, {"Sentence": "The kite danced merrily in the wind", "Rating": 6}, {"Sentence": "The village is a beautiful and relaxing place to spend the weekend", "Rating": 6}, {"Sentence": "The children giggled happily as they sat on the bench.", "Rating": 6}, {"Sentence": "The gateway of their house was covered with pretty roses.", "Rating": 6}, {"Sentence": "A fragment of the beautiful parchment was saved.", "Rating": 6}, {"Sentence": "He put his best suit on for the night out", "Rating": 6}, {"Sentence": "The bride smiled affectionately as they threw the rice and confetti over her.", "Rating": 6}, {"Sentence": "She felt wonderfully refreshed after a wash.", "Rating": 6}, {"Sentence": "Their star player scored the winning goal.", "Rating": 6.5}, {"Sentence": "He was given a beautiful gold watch when he retired.", "Rating": 6.5}, {"Sentence": "The prince and his girlfriend were passionately in love.", "Rating": 6.5}, {"Sentence": "The lady kissed him passionately.", "Rating": 6.5}, {"Sentence": "The artist celebrated after he sold his first painting", "Rating": 6.5}, {"Sentence": "The hikers paddled in the cool mountain stream. ", "Rating": 6.5}, {"Sentence": "They won a luxurious apartment.", "Rating": 6.5}, {"Sentence": "The miners cheered and hugged when they struck the gold. ", "Rating": 6.5}, {"Sentence": "The signal told her that she had won the race.", "Rating": 6.5}, {"Sentence": "On her birthday she received a beautiful diamond ring.", "Rating": 6.5}, {"Sentence": " The message bought her extremely good news.  ", "Rating": 6.5}, {"Sentence": "He gently caressed his pregnant wife's stomach.", "Rating": 6.5}, {"Sentence": "He joyfully tore the tissue off the present.", "Rating": 6.5}, {"Sentence": " She grabbed the suitcase handle and set off on her dream holiday.", "Rating": 7}, {"Sentence": "He placed tender kisses on her palm.", "Rating": 7}, {"Sentence": "He won a scholarship to study at the finest academy. ", "Rating": 7}, {"Sentence": "He was overjoyed when he received the manager of the year award.", "Rating": 7}, {"Sentence": "His uncle won four million dollars and shared it amongst their family.", "Rating": 7}, {"Sentence": "Justice was done when the jury acquitted the innocent man. ", "Rating": 7}, {"Sentence": "The doctor miraculously saved the life of the child.", "Rating": 7}], "food": [{"Sentence": "Those who had eaten oyster got chronic diarrhoea.", "Rating": 2.5, "Valence": "Neg"}, {"Sentence": "The waiter put woodlice in the casserole.", "Rating": 2.5, "Valence": "Neg"}, {"Sentence": "She put the rice on to boil and set the time for 20 minutes.", "Rating": 5, "Valence": "Neu"}, {"Sentence": "The loaves of bread are on the third aisle in the supermarket.", "Rating": 5, "Valence": "Neu"}, {"Sentence": "The baking bread smelled delicious.", "Rating": 6.5, "Valence": "Pos"}, {"Sentence": "The cool peach flesh was sweet and succulent.", "Rating": 6.5, "Valence": "Pos"}], "vehicles": [{"Sentence": "They clung to the boat as it sunk in the ocean.", "Rating": 2, "Valence": "Neg"}, {"Sentence": "The driver of the taxi was a serial killer", "Rating": 2, "Valence": "Neg"}, {"Sentence": "The truck was bound for Lyon in France.", "Rating": 5, "Valence": "Neu"}, {"Sentence": "The wagon transported the goods into the city.", "Rating": 5, "Valence": "Neu"}, {"Sentence": "The magnificent ship sailed away into the sunset.", "Rating": 6, "Valence": "Pos"}, {"Sentence": "The view from the aircraft was spectacular", "Rating": 6, "Valence": "Pos"}]};
const app = document.getElementById('app');
let group, groupWord, targets, fillers, trials, trialIdx, trialStart, pmFlagged, results;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ri(n){ return Math.floor(Math.random()*(n+1)); } // 0..n

function buildTrials(){
  group = Math.random() > 0.5 ? 'food' : 'vehicles';
  groupWord = group === 'food' ? 'food' : 'vehicle';
  targets = shuffle(DATA[group].slice());
  fillers = shuffle(DATA.fillers.slice());
  trials = [];
  let put = 10 + ri(4), ti = 0, fi = 0;
  for(let n=0;n<90;n++){
    if(ti < 6 && n === put){ trials.push({ ...targets[ti], Target: 1 }); ti++; put = put + 10 + ri(4); }
    else { trials.push({ ...fillers[fi], Target: 0, Valence: '' }); fi++; }
  }
  results = [];
}

function showStart(){
  buildTrials();
  app.innerHTML =
    '<div class="note"><b>Preview — not the original experiment.</b>' +
    'Browser recreation of pm_sentences_ks16.psyexp (PsychoPy 1.83) so you can look at the task. ' +
    'Same sentences, same 1–7 rating, same 6 hidden targets, same \\ / T keys. ' +
    'In the real task the PM instruction below is given verbally by the researcher, not shown on screen. ' +
    'Nothing is uploaded; results stay on this page.</div>' +
    '<div class="start-text">Please rate each sentence on a scale of 1–7, where 1 is very negative, 7 is very positive, and 4 is neutral. ' +
    'Proceed as quickly and accurately as possible.<br><br>' +
    '<b>Your extra job (prospective memory):</b> whenever a <b>' + groupWord + '</b> sentence appears, press <b>\\</b> or <b>T</b> as well as rating it.' +
    '<br><br>Your group letter (shown to the researcher in the real task):</div>' +
    '<div class="group-letter">' + (group === 'food' ? 'f' : 'v') + '</div>' +
    '<p class="small">Press the space bar to start. 90 sentences. Press 1–7 to rate, \\ or T for a ' + groupWord + ' sentence.</p>';
  const onKey = (e)=>{
    if(e.code === 'Space' || e.key === ' '){ document.removeEventListener('keydown', onKey); trialIdx = 0; nextTrial(); }
  };
  document.addEventListener('keydown', onKey);
}

function nextTrial(){
  if(trialIdx >= trials.length){ showEnd(); return; }
  pmFlagged = false;
  app.innerHTML = '<div class="fix">+</div>';
  setTimeout(()=>{
    const t = trials[trialIdx];
    app.innerHTML =
      '<div class="sentence">' + t.Sentence + '</div>' +
      '<div class="scale">Negative&nbsp; 1 - 2 - 3 - 4 - 5 - 6 - 7 &nbsp;Positive</div>' +
      '<div class="pm-flag" id="pmflag"></div>' +
      '<p class="small">Trial ' + (trialIdx+1) + ' of 90 &nbsp;·&nbsp; press 1–7 to rate &nbsp;·&nbsp; \\ or T if this is a ' + groupWord + ' sentence</p>';
    trialStart = performance.now();
    const onKey = (e)=>{
      const k = e.key;
      const now = performance.now();
      if(k === '\\' || k === 't' || k === 'T'){
        if(!pmFlagged){ pmFlagged = true; results.push({ trial: trialIdx, pm: true, targetRT: Math.round(now - trialStart) }); document.getElementById('pmflag').textContent = 'PM response noted'; }
        return;
      }
      if(['1','2','3','4','5','6','7'].includes(k)){
        document.removeEventListener('keydown', onKey);
        results.push({ trial: trialIdx, rating: k, ratingRT: Math.round(now - trialStart) });
        trialIdx++; nextTrial();
      }
    };
    document.addEventListener('keydown', onKey);
  }, 500);
}

function showEnd(){
  const byTrial = {};
  results.forEach(r => { byTrial[r.trial] = { ...(byTrial[r.trial]||{}), ...r }; });
  let hits=0, fa=0, pmRTs=[], rateRTs=[];
  trials.forEach((t,i)=>{
    const r = byTrial[i] || {};
    if(t.Target===1 && r.pm){ hits++; if(r.targetRT) pmRTs.push(r.targetRT); }
    if(t.Target===0 && r.pm){ fa++; }
    if(r.ratingRT) rateRTs.push(r.ratingRT);
  });
  const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) + ' ms' : '—';
  app.innerHTML =
    '<h1>Thank you very much for taking part</h1>' +
    '<table>' +
    '<tr><th>Measure</th><th>Result</th></tr>' +
    '<tr><td>PM hits (of 6 ' + groupWord + ' targets)</td><td>' + hits + ' / 6</td></tr>' +
    '<tr><td>PM false alarms (on filler trials)</td><td>' + fa + '</td></tr>' +
    '<tr><td>Mean PM response time</td><td>' + avg(pmRTs) + '</td></tr>' +
    '<tr><td>Mean rating RT</td><td>' + avg(rateRTs) + '</td></tr>' +
    '<tr><td>Group</td><td>' + groupWord + '</td></tr>' +
    '</table>' +
    '<button id="csv">Download trial data (CSV)</button> <button id="again">Run again</button>' +
    '<p class="small">Data is only in this browser tab — nothing was uploaded.</p>';
  document.getElementById('again').onclick = showStart;
  document.getElementById('csv').onclick = ()=>{
    let csv = 'trial,sentence,target,valence,group,rating,rating_rt,pm_pressed,target_rt\n';
    trials.forEach((t,i)=>{
      const r = byTrial[i] || {};
      const s = '"' + (t.Sentence||'').replace(/"/g,'""') + '"';
      csv += [i+1, s, t.Target, t.Valence||'', groupWord, r.rating||'', r.ratingRT||'', r.pm?1:0, r.targetRT||''].join(',') + '\n';
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'pm-preview-data.csv'; a.click();
  };
}
showStart();
</script>
</body>
</html>
